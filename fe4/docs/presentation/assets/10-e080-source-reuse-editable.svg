<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .bg{fill:#fff;stroke:none}.frame{fill:#fff;stroke:#111}.blue{fill:#a9cbea;stroke:#111}.red{fill:#f5aaaa;stroke:#111}.green{fill:#b9d99f;stroke:#111}.yellow{fill:#f5ddb0;stroke:#111}.gray{fill:#e5e7eb;stroke:#111}
    .wire{stroke:#111;fill:none;stroke-linejoin:round;stroke-linecap:square}.dash{stroke:#111;fill:none;stroke-dasharray:10 7}.title{fill:#111;font:700 34px Arial,"Microsoft YaHei",sans-serif}.head{fill:#111;font:700 24px Arial,"Microsoft YaHei",sans-serif}.body{fill:#111;font:17px Arial,"Microsoft YaHei",sans-serif}.small{fill:#4b5563;font:13px Arial,"Microsoft YaHei",sans-serif}.serif{fill:#111;font:21px Georgia,SimSun,serif}.mono{fill:#111;font:16px "Courier New",monospace}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#111"/></marker></defs>
  <rect width="1600" height="900" class="bg"/>
  <rect x="28" y="25" width="1544" height="830" class="frame" stroke-width="4"/>
  <text x="800" y="72" class="title" text-anchor="middle">E080 结果来源状态复用</text>
  <text x="800" y="104" class="small" text-anchor="middle">timing-safe 配置中 FE 编号等于 latency class，因此 rob_src 与 rob_lat 重复</text>

  <!-- Before data flow -->
  <path d="M140 300 L230 300" class="wire" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M140 455 L230 455" class="wire" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M410 300 L520 300" class="wire" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M410 455 L520 455" class="wire" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M620 455 L660 455" class="wire" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 620 L560 505" class="dash" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- After data flow -->
  <path d="M910 355 L1010 355" class="wire" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1190 355 L1280 355" class="wire" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1380 355 L1450 355" class="wire" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1100 520 L1100 405" class="dash" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="55" y="150" width="670" height="570" class="frame" stroke-width="2.5" fill-opacity="0"/>
  <text x="390" y="192" class="head" text-anchor="middle">E068：每个 entry 保存两份 2-bit 信息</text>
  <text x="390" y="220" class="small" text-anchor="middle">以单个 ROB entry 表示，硬件中共有 32 份</text>

  <rect x="70" y="265" width="70" height="70" class="blue" stroke-width="2.3"/>
  <text x="105" y="293" class="serif" font-size="17" text-anchor="middle">lat</text>
  <text x="105" y="318" class="small" text-anchor="middle">2 bit</text>
  <rect x="230" y="260" width="180" height="80" class="green" stroke-width="2.5"/>
  <text x="320" y="291" class="serif" text-anchor="middle">rob_lat DFF</text>
  <text x="320" y="319" class="small" text-anchor="middle">packet latency class</text>
  <rect x="520" y="260" width="110" height="80" class="blue" stroke-width="2.3"/>
  <text x="575" y="291" class="serif" font-size="18" text-anchor="middle">LAT logic</text>
  <text x="575" y="319" class="small" text-anchor="middle">pick / issue</text>

  <rect x="70" y="420" width="70" height="70" class="red" stroke-width="2.3"/>
  <text x="105" y="448" class="serif" font-size="17" text-anchor="middle">src</text>
  <text x="105" y="473" class="small" text-anchor="middle">2 bit</text>
  <rect x="230" y="415" width="180" height="80" class="red" stroke-width="2.5"/>
  <text x="320" y="446" class="serif" text-anchor="middle">rob_src DFF</text>
  <text x="320" y="474" class="small" text-anchor="middle">actual FE number</text>

  <rect x="520" y="410" width="100" height="90" class="yellow" stroke-width="2.5"/>
  <text x="570" y="445" class="head" text-anchor="middle">MUX4</text>
  <text x="570" y="475" class="small" text-anchor="middle">select FEOUT</text>
  <rect x="660" y="420" width="50" height="70" class="blue" stroke-width="2.3"/>
  <text x="685" y="451" class="serif" font-size="16" text-anchor="middle">RES</text>
  <text x="685" y="475" class="small" text-anchor="middle">data</text>
  <rect x="430" y="585" width="260" height="70" class="gray" stroke-width="2.3"/>
  <text x="560" y="614" class="mono" text-anchor="middle">select = rob_src[idx]</text>
  <text x="560" y="641" class="small" text-anchor="middle">写回和 bypass 都需要 source tag</text>

  <path d="M725 435 L805 435" class="wire" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="835" y="150" width="710" height="570" class="frame" stroke-width="2.5" fill-opacity="0"/>
  <text x="1190" y="192" class="head" text-anchor="middle">E080：safe 配置直接复用 rob_lat</text>
  <text x="1190" y="220" class="small" text-anchor="middle">DUAL_STEAL=0 时，source FE 与 latency class 恒等</text>

  <rect x="840" y="320" width="70" height="70" class="blue" stroke-width="2.3"/>
  <text x="875" y="348" class="serif" font-size="17" text-anchor="middle">lat</text>
  <text x="875" y="373" class="small" text-anchor="middle">2 bit</text>
  <rect x="1010" y="315" width="180" height="80" class="green" stroke-width="2.5"/>
  <text x="1100" y="346" class="serif" text-anchor="middle">rob_lat DFF</text>
  <text x="1100" y="374" class="small" text-anchor="middle">state kept</text>
  <rect x="1280" y="310" width="100" height="90" class="yellow" stroke-width="2.5"/>
  <text x="1330" y="345" class="head" text-anchor="middle">MUX4</text>
  <text x="1330" y="375" class="small" text-anchor="middle">select FEOUT</text>
  <rect x="1450" y="320" width="70" height="70" class="blue" stroke-width="2.3"/>
  <text x="1485" y="348" class="serif" font-size="16" text-anchor="middle">RES</text>
  <text x="1485" y="373" class="small" text-anchor="middle">data</text>

  <rect x="970" y="485" width="260" height="70" class="green" stroke-width="2.3"/>
  <text x="1100" y="514" class="mono" text-anchor="middle">select = rob_lat[idx]</text>
  <text x="1100" y="541" class="small" text-anchor="middle">同一状态同时表示 latency 和 source</text>

  <rect x="920" y="590" width="340" height="75" class="gray" stroke-width="2.3"/>
  <text x="1090" y="620" class="serif" text-anchor="middle">删除 32 × 2-bit rob_src DFF</text>
  <text x="1090" y="647" class="small" text-anchor="middle">对应写入活动与选择控制同时消失</text>
  <path d="M935 605 L1245 650 M1245 605 L935 650" class="wire" stroke-width="3"/>

  <rect x="1300" y="555" width="210" height="110" class="blue" stroke-width="2.3"/>
  <text x="1405" y="590" class="serif" text-anchor="middle">dual / full 配置</text>
  <text x="1405" y="622" class="body" text-anchor="middle">仍保留 rob_src</text>
  <text x="1405" y="650" class="small" text-anchor="middle">支持跨类 stealing</text>

  <text x="800" y="785" class="body" font-weight="700" text-anchor="middle">优化只删除重复状态，不增加流水级，不改变 BKPR、picker 或发射策略</text>
</svg>
