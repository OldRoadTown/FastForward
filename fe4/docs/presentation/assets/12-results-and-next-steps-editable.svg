<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .bg{fill:#fff;stroke:none}.frame{fill:#fff;stroke:#111}.blue{fill:#a9cbea;stroke:#111}.red{fill:#f5aaaa;stroke:#111}.green{fill:#b9d99f;stroke:#111}.yellow{fill:#f5ddb0;stroke:#111}.gray{fill:#e5e7eb;stroke:#111}
    .wire{stroke:#111;fill:none;stroke-linejoin:round;stroke-linecap:square}.title{fill:#111;font:700 34px Arial,"Microsoft YaHei",sans-serif}.head{fill:#111;font:700 22px Arial,"Microsoft YaHei",sans-serif}.body{fill:#111;font:16px Arial,"Microsoft YaHei",sans-serif}.small{fill:#4b5563;font:13px Arial,"Microsoft YaHei",sans-serif}.serif{fill:#111;font:21px Georgia,SimSun,serif}.mono{fill:#111;font:18px "Courier New",monospace}.number{fill:#111;font:700 28px Arial,"Microsoft YaHei",sans-serif}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#111"/></marker></defs>
  <rect width="1600" height="900" class="bg"/>
  <rect x="28" y="25" width="1544" height="830" class="frame" stroke-width="4"/>
  <text x="800" y="72" class="title" text-anchor="middle">结果与当前限制</text>
  <text x="800" y="104" class="small" text-anchor="middle">cycles、逻辑代理与开源 STA 使用各自固定基线，不能跨环境混算</text>

  <!-- Cycles chart -->
  <rect x="60" y="140" width="760" height="425" class="frame" stroke-width="2.5" fill-opacity="0"/>
  <text x="90" y="180" class="head">重载代表用例 cycles</text>
  <text x="90" y="207" class="small">越短越好，E080 与 E068 完全一致</text>
  <line x1="190" y1="470" x2="760" y2="470" class="wire" stroke-width="2"/>
  <line x1="190" y1="235" x2="190" y2="470" class="wire" stroke-width="2"/>

  <text x="170" y="280" class="body" text-anchor="end">v28</text>
  <rect x="190" y="245" width="540" height="52" class="red" stroke-width="2"/>
  <text x="745" y="279" class="mono">10337</text>

  <text x="170" y="365" class="body" text-anchor="end">E066</text>
  <rect x="190" y="330" width="500" height="52" class="yellow" stroke-width="2"/>
  <text x="705" y="364" class="mono">9567</text>

  <text x="170" y="450" class="body" text-anchor="end">E068 / E080</text>
  <rect x="190" y="415" width="474" height="52" class="green" stroke-width="2"/>
  <text x="679" y="449" class="mono">9070</text>

  <text x="470" y="520" class="body" font-weight="700" text-anchor="middle">v28 到 E080：减少 1267 cycles，约 12.3%</text>
  <text x="470" y="548" class="small" text-anchor="middle">该数字只对应 experiment-log 中同列代表用例</text>

  <!-- Historical timing proxy -->
  <rect x="850" y="140" width="690" height="200" class="frame" stroke-width="2.5" fill-opacity="0"/>
  <text x="880" y="180" class="head">历史配对时序代理</text>
  <text x="880" y="207" class="small">E066 与 E067 使用同一 Yosys/ABC 命令</text>
  <rect x="900" y="240" width="190" height="65" class="red" stroke-width="2.3"/>
  <text x="995" y="267" class="body" text-anchor="middle">E066 nominal</text>
  <text x="995" y="294" class="mono" font-weight="700" text-anchor="middle">0.8875 ns</text>
  <path d="M1090 272 L1260 272" class="wire" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1260" y="240" width="230" height="65" class="green" stroke-width="2.3"/>
  <text x="1375" y="267" class="body" text-anchor="middle">E067 / E068 nominal</text>
  <text x="1375" y="294" class="mono" font-weight="700" text-anchor="middle">0.8675 ns</text>

  <!-- Current open-source baseline -->
  <rect x="850" y="365" width="690" height="200" class="frame" stroke-width="2.5" fill-opacity="0"/>
  <text x="880" y="405" class="head">当前开源 OS-P00 基线</text>
  <text x="880" y="432" class="small">E080，Nangate45 typical，pre-layout ideal clock</text>
  <rect x="900" y="465" width="245" height="65" class="yellow" stroke-width="2.3"/>
  <text x="1022" y="492" class="body" text-anchor="middle">required</text>
  <text x="1022" y="519" class="mono" font-weight="700" text-anchor="middle">0.3206 ns</text>
  <rect x="1210" y="465" width="280" height="65" class="red" stroke-width="2.3"/>
  <text x="1350" y="492" class="body" text-anchor="middle">setup arrival</text>
  <text x="1350" y="519" class="mono" font-weight="700" text-anchor="middle">1.0541 ns</text>
  <text x="1195" y="553" class="small" text-anchor="middle">0.4 ns 目标尚未收敛，且代理 FE 不是生产实现</text>

  <!-- E080 area result -->
  <rect x="60" y="600" width="1480" height="145" class="green" stroke-width="2.8"/>
  <text x="105" y="640" class="head">E080 相对 E068</text>
  <text x="430" y="691" class="number" text-anchor="middle">cycles 不变</text>
  <text x="800" y="691" class="number" text-anchor="middle">删除 64 个状态位</text>
  <text x="1200" y="691" class="number" text-anchor="middle">ABC-simple cells 减少 672</text>
  <line x1="605" y1="655" x2="605" y2="718" class="wire" stroke-width="2"/>
  <line x1="1000" y1="655" x2="1000" y2="718" class="wire" stroke-width="2"/>

  <rect x="160" y="775" width="1280" height="55" class="gray" stroke-width="2.2"/>
  <text x="800" y="810" class="body" text-anchor="middle">下一步：真实 FE + 正式 P&amp;R STA + workload SAIF Power + 统一用例 T</text>
</svg>
